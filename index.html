<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game Đắc Kỷ</title>
    <!-- Trình giả lập Ruffle giúp chạy file SWF trên web -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #f1c40f; }
        #game-container {
            width: 1000px;
            height: 600px;
            margin: 20px auto;
            border: 2px solid #444;
        }
    </style>
</head>
<body>
    <h1>Đắc Kỷ Web Game</h1>
    <p>Đang tải game, vui lòng đợi trong giây lát...</p>
    
    <!-- Khung chạy file GameMain.swf -->
    <div id="game-container">
        <object width="100%" height="100%" data="GameMain.swf"></object>
    </div>
</body>
</html>
